<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>博客</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box }
    body {
      min-height: 100vh;
      display: flex;
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
    }
    .sidebar {
      width: 220px;
      background: #fff;
      padding: 32px 20px;
      border-right: 1px solid #e0e0e0;
      flex-shrink: 0;
      height: 100vh;
      position: sticky;
      top: 0;
    }
    .sidebar h3 { font-size: 18px; color: #333; margin-bottom: 20px }
    .sidebar a { display: block; color: #0066cc; text-decoration: none; font-size: 15px; padding: 6px 0 }
    .sidebar a:hover { text-decoration: underline }
    .sidebar .back { margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid #e0e0e0 }
    .main {
      flex: 1;
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 32px;
    }
    .main h1 { font-size: 28px; color: #333; margin-bottom: 24px; border-bottom: 2px solid #0066cc; padding-bottom: 8px }
    .main h2 { font-size: 22px; color: #333; margin: 32px 0 12px }
    .main p { font-size: 16px; line-height: 1.8; color: #444; margin-bottom: 16px }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="back">
      <a href="../index.html">← 返回首页</a>
    </div>
    <h3>所有文章</h3>
    <a href="index.html">第一篇博客</a>
  </div>
  <div class="main">
    <h1>第一篇博客</h1>
    <p>这是我的第一篇博客文章。今天开始学习网页开发，感觉很有趣。</p>
    <h2>学习收获</h2>
    <p>学会了 HTML 基础结构、CSS 布局和样式，以及如何用 GitHub Pages 部署个人主页。</p>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人主页</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
    }
    .profile {
      background: #9de0ff;
      padding: 32px 0 32px 48px;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      display: flex;
      align-items: flex-start;
      width: 100%;
      max-width: 600px;
    }
    .profile .info { flex: 1 }
    .profile .photo {
      width: 120px;
      height: 140px;
      border-radius: 8px;
      flex-shrink: 0;
      margin: 48px 48px 0 32px;
      object-fit: cover;
    }
    .profile h1 { font-size: 28px; margin-bottom: 24px }
    .row { display: table-row }
    .row span { display: table-cell; font-size: 18px; line-height: 2.4; color: #333 }
    .row .label { color: #577bff; text-align: right; padding-right: 8px; white-space: nowrap }
    .blog { margin-top: 48px; width: 100%; max-width: 600px }
    .blog h2 { color: #0066cc; font-size: 24px; border-bottom: 2px solid #0066cc; padding-bottom: 8px; margin-bottom: 16px }
    .blog p { font-size: 16px; line-height: 1.8; color: #333 }
    .blog a { color: #0066cc; text-decoration: none; font-size: 14px }
    .blog a:hover { text-decoration: underline }
  </style>
</head>
<body>
  <div class="profile">
    <div class="info">
      <h1>个人资料</h1>
      <div class="row"><span class="label">姓名：</span><span>熊锦梁</span></div>
      <div class="row"><span class="label">性别：</span><span>男</span></div>
      <div class="row"><span class="label">学习方向：</span><span>计算与应用数学</span></div>
    </div>
    <img class="photo" src="pictures/empty_photo.jpeg" alt="头像">
  </div>
  <div class="blog">
    <h2>我的博客</h2>
    <p>Dijkstra算法和A*算法</p>
    <a href="blog/blog1.html">阅读全文 →</a>
  </div>
</body>
</html>

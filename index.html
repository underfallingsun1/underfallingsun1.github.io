<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人主页</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box }
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
    }
    .profile {
      background: #9de0ff;
      padding: 48px 64px;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      text-align: center;
    }
    .profile h1 { font-size: 28px; margin-bottom: 24px }
    .profile p { font-size: 18px; line-height: 2; color: #333 }
    .profile span { color: #577bff; margin-right: 8px }
  </style>
</head>
<body>
  <div class="profile">
    <h1>个人资料</h1>
    <p><span>姓名：</span>熊锦梁</p>
    <p><span>性别：</span>男</p>
    <p><span>学习方向:</span>数学和计算数学</p>
  </div>
</body>
</html>
